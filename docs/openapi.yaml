openapi: 3.0.3
info:
  title: Go Todo Service
  description: REST API for To-Do CRUD operations
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local

paths:
  /ping:
    get:
      summary: Ping
      description: Liveness check
      responses:
        '200':
          description: OK

  /healthz:
    get:
      summary: Healthz
      description: Detailed health (requires Xdrv-Healthz-Token header)
      parameters:
        - in: header
          name: Xdrv-Healthz-Token
          required: true
          schema:
            type: string
            default: dev
      responses:
        '200':
          description: OK
        '401':
          description: Invalid token

  /api/v1/todos:
    get:
      summary: List todos
      parameters:
        - name: include_completed
          in: query
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum: [due_date_asc, due_date_desc, created_at_asc, created_at_desc]
            default: due_date_asc
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of todos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTodosResponse'
    post:
      summary: Create todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '400':
          description: Validation error

  /api/v1/todos/{id}:
    get:
      summary: Get todo by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '404':
          description: Not found
    put:
      summary: Update todo (partial)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '404':
          description: Not found
    delete:
      summary: Delete todo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No content
        '404':
          description: Not found

components:
  schemas:
    CreateTodoRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        due_date:
          type: string
          format: date-time
        repeat_type:
          type: string
          enum: [none, daily, weekly, monthly, yearly]
          default: none

    UpdateTodoRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        completed:
          type: boolean
        due_date:
          type: string
          format: date-time
        repeat_type:
          type: string
          enum: [none, daily, weekly, monthly, yearly]

    TodoResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
        due_date:
          type: string
          format: date-time
          nullable: true
        repeat_type:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListTodosResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoResponse'
        total:
          type: integer
